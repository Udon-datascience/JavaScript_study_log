<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>テンプレート</title>
<link href="../_common/images/favicon.ico" rel="shortcut icon">
<link href="https://fonts.googleapis.com/css?family=M+PLUS+1p:400,500" rel="stylesheet">
<link href="../_common/css/style.css" rel="stylesheet">
</head>
<body>
<header>
<div class="container">
<h1>タイトル</h1>
<h2>サブタイトル</h2>
</div><!-- /.container -->
</header>
<main>
<div class="container">

<section>
    <p>最終アクセス日時:<span id="time"></span></p>
    <p>最終アクセス日時:<span id="time2"></span></p>
</section>

</div><!-- /.container -->
</main>
<footer>
<div class="container">
<p>JavaScript Samples</p>
</div><!-- /.container -->
</footer>

<script>
'use strict';

const now = new Date();
const year = now.getFullYear();
const month = now.getMonth();
const date = now.getDate();
const hour = now.getHours();
const min = now.getMinutes();

const output = `${year}/${month + 1}/${date} ${hour}:${min}`
document.getElementById('time1').textContent = output;

const ampm = 0
if(hour >= 13){
    re_hour = hour - 12;
    ampm = 'p.m.';
}else{
    re_hour = hour;
    ampm = 'a.m.';
}

const output2 = `${year}/${month + 1}/${date} ${re_hour}${ampm}`
document.getElementById('time2').textContent = output2;
</script>

</body>
</html>
